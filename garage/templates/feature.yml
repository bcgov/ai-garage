name: Feature / story
description: Spec-traceable work for the garage
title: "feature: "
labels: ["enhancement", "ready-for-agent"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck and what hurts?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Measurable user/business result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Research, incidents, or analytics motivating this work
      placeholder: User testing on 2026-08-20 — 2/4 participants could not find export…
  - type: input
    id: spec_ref
    attributes:
      label: Spec reference
      description: Path or section in spec/ (e.g. spec/features/apply.feature)
      placeholder: spec/features/….feature
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Prefer Gherkin Given/When/Then
      value: |
        Given …
        When …
        Then …
    validations:
      required: true
  - type: dropdown
    id: live_proof
    attributes:
      label: Live proof
      description: >
        Choose required only when the bug can be shown with a request against a
        local copy (injection, a reachable login gap, a server-identity check).
        Logging, tests, headers, and dependency cleanup stay "not applicable".
        Choose unavailable when the local copy cannot be built because a
        dependency on the bug's path cannot be started. Then add the matching
        label live-proof or live-proof-unavailable, and put Finding-Id in the body.
      options:
        - not applicable
        - required
        - unavailable
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints acknowledged
      options:
        - label: WCAG 2.1 AA / B.C. Design System for UI
        - label: No personal information without PIA
        - label: OpenShift deploy target (or ADR exception)
